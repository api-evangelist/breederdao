apis:
- name: ReadyGamer API
  description: >-
    ReadyGamer is a joint venture between Sovrun and Virtuals that enables
    AI-powered, autonomous decision-making for in-game NPCs through the GAME
    framework. The HTTP API accepts POST chat requests per game and command
    (e.g. /api/roblox/lightsout/chat), authenticated with an X-API-Key header
    distributed by the ReadyGamer team, and returns the agent's response.
