name: BreederDAO
description: >-
  BreederDAO (rebranded as Sovrun) is a Web3 gaming infrastructure company that
  began as a factory for high-volume, in-game NFT assets — breeding and crafting
  digital items for blockchain games and gaming guilds — and has since evolved
  into a platform for fully on-chain games and Autonomous Worlds. Its developer
  surface today centers on the Sovrun SDK (traditional game-dev tooling stitched
  to on-chain game and Autonomous World generators), the Chain Tactics moddable
  game, the $SOVRN token running on EVM chains (Ethereum, Base, and a
  Hyperliquid-based Sovrun L2), and the ReadyGamer API — a joint venture with
  Virtuals that exposes an HTTP endpoint for AI-agent NPC chat inside games such
  as Roblox. Backed by a16z.
